appId: com.songchordanalyzer.app
productName: Song Chord Analyzer
copyright: Copyright © 2026 Song Chord Analyzer

directories:
  output: dist_electron
  buildResources: build

files:
  - "electron/**/*"
  - "frontend/dist/**/*"
  - "backend/**/*"
  - "models/**/*"
  - "shared/**/*"
  - "run_app.py"
  - "package.json"

asar: true
asarUnpack:
  - "backend/**/*"
  - "models/**/*"
  - "shared/**/*"
  - "frontend/dist/**/*"
  - "run_app.py"

extraResources:
  - from: "resources/"
    to: "."
    filter:
      - "**/*"

win:
  icon: build/app.ico
  signtoolOptions:
    sign: electron/sign-noop.cjs
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  fileAssociations:
    - ext:
        - mp3
        - wav
        - flac
        - m4a
        - aac
        - ogg
      name: Audio File
      role: Viewer

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Song Chord Analyzer
  artifactName: "SongChordAnalyzer-Setup.${ext}"

portable:
  artifactName: "SongChordAnalyzer.${ext}"

mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Song Chord Analyzer requires microphone access if live audio input is selected."
    NSHighResolutionCapable: true
  fileAssociations:
    - ext:
        - mp3
        - wav
        - flac
        - m4a
        - aac
        - ogg
      name: Audio File
      role: Viewer

dmg:
  title: "${productName} ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  artifactName: "SongChordAnalyzer-mac-${arch}.${ext}"
