name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend SPA
        working-directory: ./frontend
        run: npm run build

      - name: Fetch Static FFmpeg Binary
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Build & Package Desktop Application (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SongChordAnalyzer-Windows
          path: |
            dist_electron/*.exe
            dist_electron/*.zip
          if-no-files-found: error
